name: Pull Docker Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Docker image to pull (e.g., czkawka-cn, krokiet-cn, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - czkawka-cn
          - krokiet-cn
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
      output_dir:
        description: 'Output directory'
        required: false
        default: 'images'

jobs:
  pull-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == '' || github.event.inputs.image == null || github.event.inputs.image == 'null' || github.event.inputs.image == 'undefined' || github.event.inputs.image == '""' || github.event.inputs.image == "''" || github.event.inputs.image == 'None' || github.event.inputs.image == 'none' || fromJSON('["czkawka-cn","krokiet-cn"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Pull Docker image with skopeo
        run: |
          IMAGE_NAME="${{ matrix.image }}"
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          OUTPUT_DIR="images/${IMAGE_NAME}"
          mkdir -p "${OUTPUT_DIR}"
          
          echo "Pulling ${IMAGE_NAME}:${TAG}..."
          skopeo copy \
            --src docker://docker.io/jlesage/${IMAGE_NAME} \
            --dest dir://${OUTPUT_DIR} \
            docker.io/jlesage/${IMAGE_NAME}:${TAG}
          
          echo "Saved to ${OUTPUT_DIR}"

      - name: Generate checksum
        run: |
          IMAGE_NAME="${{ matrix.image }}"
          OUTPUT_DIR="images/${IMAGE_NAME}"
          if [ -f "${OUTPUT_DIR}/manifest.json" ]; then
            sha256sum "${OUTPUT_DIR}/manifest.json" > "${OUTPUT_DIR}/sha256sum.txt"
            echo "Checksum generated"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.image }}-image"
          path: images/${{ matrix.image }}
          retention-days: 7
